<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>デイリーホーム</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --sub: #6b6a64; --line: #e4e2da;
  --accent: #2f5d8a; --red: #b3261e; --red-bg: #fbeceb; --amber: #8a5a00; --amber-bg: #fdf3dc;
  --green: #2e7d4f; --chip: #eeece5; --sat: #2f5d8a; --acc-bg: #e3ecf6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --card: #1f1f1d; --ink: #ecebe6; --sub: #a09f98; --line: #34332f;
    --accent: #8db8e3; --red: #f2857c; --red-bg: #3a1f1d; --amber: #f0c060; --amber-bg: #3a2f17;
    --green: #7fcf9c; --chip: #2b2b28; --sat: #8db8e3; --acc-bg: #1f2e3d;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  padding: env(safe-area-inset-top) 0 calc(130px + env(safe-area-inset-bottom));
}
main { max-width: 720px; margin: 0 auto; padding: 0 16px; }
header { padding: 18px 0 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 24px; margin: 0; letter-spacing: .02em; }
.meta { color: var(--sub); font-size: 12px; text-align: right; }
.meta.stale { color: var(--red); font-weight: 600; }
.summary { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--sub); }
.pill.red { background: var(--red-bg); color: var(--red); font-weight: 600; }
.pill.amber { background: var(--amber-bg); color: var(--amber); font-weight: 600; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; padding: 12px 14px; }
section.red { border-color: var(--red); }
h2 { font-size: 14px; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
h2 .n { color: var(--sub); font-weight: 400; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary h2::after { content: "▸"; color: var(--sub); margin-left: auto; }
details[open] > summary h2::after { content: "▾"; }
ul { list-style: none; margin: 0; padding: 0; }
li.task { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: flex-start; }
li.task:first-child { border-top: 0; }
li.task.child { padding-left: 26px; }
input[type=checkbox] { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.done .txt { text-decoration: line-through; color: var(--sub); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; color: var(--sub); }
.due { font-weight: 600; }
.due.red { color: var(--red); }
.due.amber { color: var(--amber); }
a { color: var(--accent); text-decoration: none; }
a.note::before { content: "📝 "; }
.ev { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ev:first-child { border-top: 0; }
.ev .t { width: 44px; flex: none; color: var(--sub); font-variant-numeric: tabular-nums; }
.day { font-size: 12px; color: var(--sub); margin: 8px 0 2px; font-weight: 600; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: 4px; }
button.cd {
  display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 84px; padding: 4px 2px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  font: inherit; font-weight: 400; text-align: left; cursor: pointer;
}
button.cd.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cd .dh { font-size: 11px; color: var(--sub); text-align: center; line-height: 1.2; }
.cd .dn { font-size: 16px; font-weight: 700; text-align: center; line-height: 1.15; }
.cd.today .dn { color: #fff; background: var(--accent); border-radius: 99px; width: 26px; margin: 0 auto; }
.cd.sun .dh, .cd.sun:not(.today) .dn { color: var(--red); }
.cd.sat .dh, .cd.sat:not(.today) .dn { color: var(--sat); }
.sk .t { width: 66px; font-weight: 600; color: var(--ink); }
.sk .sb { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sk .sb .meta { display: block; text-align: left; }
.sk .dd { color: var(--red); font-weight: 600; font-variant-numeric: tabular-nums; }
.sk.new .t::after { content: " 🆕"; font-size: 11px; }
.pk { padding: 7px 0; border-top: 1px solid var(--line); }
.pk:first-of-type { border-top: 0; }
.pk .ph { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pk .ph b { font-size: 15px; }
.pk .rs, .pk .rk { font-size: 13px; overflow-wrap: anywhere; }
.pk .rk { color: var(--sub); }
.pk-lv { font-size: 12px; font-weight: 700; margin: 10px 0 2px; }
.pk-lv.buy { color: var(--green); } .pk-lv.watch { color: var(--amber); } .pk-lv.avoid { color: var(--red); }
.disc { font-size: 11px; color: var(--sub); margin-top: 8px; }
.chip { font-size: 10px; line-height: 1.3; padding: 1px 3px; border-radius: 4px; background: var(--chip); overflow: hidden; word-break: break-all; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
.chip.timed { background: var(--acc-bg); }
.chip.task { background: var(--red-bg); color: var(--red); font-weight: 600; }
.more { font-size: 10px; color: var(--sub); text-align: center; }
.calday { margin-top: 10px; }
.ev .t.task { color: var(--red); }
.wt { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.wt th { font-size: 11.5px; color: var(--sub); font-weight: 600; text-align: left; padding: 4px; border-bottom: 1px solid var(--line); }
.wt td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.35; word-break: break-word; }
.wt th:first-child, .wt td:first-child { width: 24px; font-weight: 700; padding-left: 6px; }
.wt tr.today td { background: var(--acc-bg); }
.wt td.off { color: var(--sub); }
.kbm { margin-top: 10px; font-size: 13px; line-height: 1.5; }
.kbm summary { cursor: pointer; font-weight: 600; }
.kbm b { display: block; margin-top: 6px; }
.kbm ul { margin: 2px 0 0 18px; padding: 0; }
.day.today { color: var(--accent); }
.lead { font-size: 13px; color: var(--sub); margin: 0 0 6px; padding-left: 10px; border-left: 3px solid var(--line); }
.empty { color: var(--sub); font-size: 13px; padding: 4px 0; }
.from { font-size: 12px; color: var(--sub); }
.routine .rl { font-size: 13px; color: var(--sub); }
.train .sub { font-size: 13px; color: var(--sub); }
.yt .head { font-size: 14px; font-weight: 600; margin-top: 2px; }
.yt ul.pts { list-style: disc; padding-left: 18px; margin: 4px 0 0; font-size: 13px; }
.yt ul.pts li { margin: 2px 0; }
.yt .hn { font-size: 13px; margin-top: 4px; padding: 4px 8px; border-radius: 6px; background: var(--acc-bg); }
.train ol { margin: 4px 0 0; padding-left: 20px; font-size: 14px; }
.train ol.opt { color: var(--sub); font-size: 13px; }
.seg { display: inline-flex; gap: 4px; flex: none; }
.seg button { padding: 3px 10px; font-size: 12px; white-space: nowrap; }
.pill.acc { background: var(--acc-bg); color: var(--accent); font-weight: 600; }
.wait { opacity: .6; }
#bar {
  position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom)); padding: 10px 16px; z-index: 21;
  background: var(--card); border-top: 1px solid var(--line); display: none; gap: 10px; align-items: center; justify-content: center;
}
#bar.show { display: flex; }
button {
  font: inherit; border: 0; border-radius: 10px; padding: 9px 14px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.ghost):not(.icon-btn):not(.cd):not(.tb) { color: #10202e; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cd.today .dn { color: #10202e; } }
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
.tabbar button.tb { flex: 1; background: none; border-radius: 0; padding: 8px 0 6px; color: var(--sub); font-size: 11px; font-weight: 400; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.tabbar button.tb .ic { font-size: 20px; line-height: 1.2; }
.tabbar button.tb.sel { color: var(--accent); font-weight: 600; }
.tabbar .badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; }
header .right { display: flex; align-items: center; gap: 8px; }
.icon-btn { background: var(--chip); color: var(--ink); font-weight: 400; padding: 6px 10px; font-size: 14px; white-space: nowrap; }
.icon-btn:disabled { opacity: .6; }
.rstat { font-size: 13px; color: var(--sub); margin: -4px 0 10px; }
.rstat.err { color: var(--red); }
.token input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 6px 0; }
.token ol { margin: 4px 0 8px; padding-left: 20px; font-size: 13px; color: var(--sub); }
button.ghost { background: var(--chip); color: var(--ink); font-weight: 400; }
#lock { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
#lock input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); margin: 12px 0; }
#lock .err { color: var(--red); font-size: 13px; min-height: 1.4em; }
</style>
</head>
<body>
<div id="lock" hidden>
  <h1>デイリーホーム</h1>
  <p class="meta" style="text-align:center">パスフレーズを入力してください（この端末に保存されます）</p>
  <form id="lockForm">
    <input id="pass" type="password" autocomplete="current-password" aria-label="パスフレーズ">
    <button type="submit">開く</button>
  </form>
  <p class="err" id="lockErr"></p>
</div>
<main id="app" hidden></main>
<div id="bar"><span id="barText"></span><button id="shareBtn" type="button">Inboxへ送る</button><button id="clearBtn" class="ghost" type="button">取消</button></div>

<script>
/* global TextEncoder, TextDecoder */
'use strict';
const KEY = 'dh.v1';
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const TABS = ['home', 'eng', 'health', 'invest'];
let DATA = null;
let S = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (!s || typeof s !== 'object') throw new Error('bad');
    return { tab: TABS.indexOf(s.tab) >= 0 ? s.tab : 'home', gym: s.gym === '2' ? '2' : '1', pass: typeof s.pass === 'string' ? s.pass : '', gh: typeof s.gh === 'string' ? s.gh : '', checks: s.checks && typeof s.checks === 'object' ? s.checks : {}, sent: s.sent && typeof s.sent === 'object' ? s.sent : {}, outbox: Array.isArray(s.outbox) ? s.outbox.filter(x => typeof x === 'string') : [] };
  } catch (e) {
    return { tab: 'home', gym: '1', pass: '', gh: '', checks: {}, sent: {}, outbox: [] };
  }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 保存できなくても表示は続ける */ } }

// ---------- 日付 ----------
function todayISO(now) {
  const d = now || new Date();
  // 端末の時刻を東京時間として扱う（JST固定）
  const j = new Date(d.getTime() + (9 * 60 + d.getTimezoneOffset()) * 60000);
  return j.getFullYear() + '-' + String(j.getMonth() + 1).padStart(2, '0') + '-' + String(j.getDate()).padStart(2, '0');
}
function diffDays(a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 86400000); }
function addDays(iso, n) { const t = new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000); return t.toISOString().slice(0, 10); }
function md(iso) { const [, m, d] = iso.split('-'); return (+m) + '/' + (+d); }
function wd(iso) { return WD[new Date(iso + 'T00:00:00Z').getUTCDay()]; }
function relLabel(due, today) {
  const n = diffDays(due, today);
  if (n < 0) return (-n) + '日超過';
  if (n === 0) return '今日';
  if (n === 1) return '明日';
  return 'あと' + n + '日';
}

// ---------- 振り分け（純粋関数） ----------
// タスクハブのデータを「期限切れ／今日／今週／今後」に分ける。done（取り消し線）は除く。
function classify(hub, today) {
  const out = { overdue: [], today: [], week: [], later: [], undated: [] };
  const week7 = addDays(today, 7);
  (hub.week || []).forEach(it => {
    if (it.done) return;
    const x = Object.assign({ kind: 'week' }, it);
    if (it.due && it.due < today) out.overdue.push(x);
    else if (it.due === today) out.today.push(x);
    else out.week.push(x);
  });
  (hub.dated || []).forEach(it => {
    if (it.done) return;
    const x = Object.assign({ kind: 'dated' }, it);
    if (!it.due) { (it.asap ? out.week : out.undated).push(x); return; }
    if (it.start && it.start <= today && today <= it.due) { (it.due === today ? out.today : out.week).push(Object.assign(x, { ongoing: true })); return; }
    if (it.due < today) out.overdue.push(x);
    else if (it.due === today) out.today.push(x);
    else if (it.due <= week7 || (it.start && it.start <= week7)) out.week.push(x);
    else out.later.push(x);
  });
  const byDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0;
  out.overdue.sort(byDue); out.week.sort(byDue); out.later.sort(byDue);
  return out;
}

// 前日以前にチェックしたものは表示しない（今日チェックしたものは打ち消し線で残す）
function hideOld(items, checks, today) {
  return (items || []).filter(it => !(checks[it.id] && checks[it.id] < today));
}
// Mac へ送る完了の依頼。公開 issue なので本文には ID だけを書く
function doneBody(ids) {
  return ids.filter(x => /^[0-9a-f]{10}$/.test(x)).map(x => 'id:' + x).join('\n');
}
function hubIds(data) {
  const set = new Set();
  const walk = (arr) => (arr || []).forEach(it => { set.add(it.id); walk(it.children); });
  const h = (data && data.hub) || {};
  ['week', 'dated', 'big', 'someday'].forEach(k => walk(h[k]));
  return set;
}

// 完了報告の文面。OET・メールは対象外（タスクハブの項目だけ）
function reportText(items) {
  return items.map(it => '✅完了: ' + plain(it.text)).join('\n');
}
function pendingReports(data, checks, sent) {
  if (!data) return [];
  const all = [];
  const h = data.hub || {};
  const walk = (arr) => (arr || []).forEach(it => { all.push(it); walk(it.children); });
  walk(h.week); walk(h.dated); walk(h.big); walk(h.someday);
  return all.filter(it => !it.done && checks[it.id] && !sent[it.id]);
}

// ---------- 表示用 ----------
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function plain(s) { return String(s || '').replace(/\*\*|~~/g, '').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2').replace(/\[\[([^\]]+)\]\]/g, '$1'); }
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function noteLink(name) {
  return '<a class="note" href="obsidian://open?vault=' + encodeURIComponent('Obsidian Vault') + '&amp;file=' + encodeURIComponent(name) + '">' + esc(name) + '</a>';
}

function taskLi(it, today, opts) {
  const o = opts || {};
  const checked = !!S.checks[it.id];
  const tags = [];
  if (it.due) {
    const n = diffDays(it.due, today);
    const cls = n < 0 ? 'red' : n <= 1 ? 'amber' : '';
    const lab = it.label ? esc(it.label) : md(it.due) + '（' + wd(it.due) + '）';
    tags.push('<span class="due ' + cls + '">' + lab + (it.ongoing ? ' · 期間中' : ' · ' + relLabel(it.due, today)) + '</span>');
  } else if (it.label) {
    tags.push('<span class="due' + (it.asap ? ' amber' : '') + '">' + esc(it.label) + '</span>');
  }
  if (it.area) tags.push('<span>' + esc(it.area) + '</span>');
  (it.notes || []).forEach(n => tags.push(noteLink(n)));
  let h = '<li class="task' + (o.child ? ' child' : '') + (checked ? ' done' : '') + '">' +
    '<input type="checkbox" data-id="' + esc(it.id) + '"' + (checked ? ' checked' : '') + ' aria-label="完了">' +
    '<div class="body"><div class="txt">' + inline(it.text) + '</div>' +
    (tags.length ? '<div class="tags">' + tags.join('') + '</div>' : '') + '</div></li>';
  if (o.withChildren) (it.children || []).forEach(c => { if (!c.done && !(S.checks[c.id] && S.checks[c.id] < today)) h += taskLi(c, today, { child: true }); });
  return h;
}

function sec(title, n, inner, cls) {
  return '<section class="' + (cls || '') + '"><h2>' + title + (n != null ? ' <span class="n">' + n + '</span>' : '') + '</h2>' + inner + '</section>';
}
function fold(title, n, inner) {
  return '<section><details><summary><h2>' + title + ' <span class="n">' + n + '</span></h2></summary>' + inner + '</details></section>';
}

function render() {
  const app = document.getElementById('app');
  const today = todayISO();
  const d = DATA;
  const c = classify(d.hub || {}, today);
  ['overdue', 'today', 'week', 'later', 'undated'].forEach(k => { c[k] = hideOld(c[k], S.checks, today); });
  const cal = ((d.calendar && d.calendar.events) || []).filter(e => e.date >= today && e.date <= addDays(today, 6));
  const mails = ((d.gmail && d.gmail.items) || []).filter(m => !(S.checks['mail:' + m.url] && S.checks['mail:' + m.url] < today));
  const mailOpen = mails.filter(m => !m.waiting && !S.checks['mail:' + m.url]);

  const ageH = (Date.now() - Date.parse(d.generated)) / 3600000;
  let h = '<header><h1>' + md(today) + '（' + wd(today) + '）</h1><div class="right"><div class="meta' + (ageH > 36 ? ' stale' : '') + '">' +
    '更新 ' + esc(String(d.generated).slice(5, 16).replace('T', ' ')) + (ageH > 36 ? '<br>データが古い' : '') + '</div>' +
    '<button type="button" class="icon-btn" data-act="refresh" aria-label="更新"' + (R.timer ? ' disabled' : '') + '>' + (R.timer ? '⏳ 更新中' : '🔄 更新') + '</button>' +
    '<button type="button" class="icon-btn" data-act="settings" aria-label="設定">⚙</button></div></header>';
  if (R.msg) h += '<p class="rstat' + (R.err ? ' err' : '') + '">' + esc(R.msg) + '</p>';
  if (R.showToken) h += tokenPanel();

  if (S.tab === 'invest') {
    h += investTab(d, today);
  } else if (S.tab === 'eng') {
    h += engTab(d, today);
  } else if (S.tab === 'health') {
    h += healthTab(d, today);
  } else {
  h += '<div class="summary">' +
    (c.overdue.length ? '<span class="pill red">期限切れ ' + c.overdue.length + '</span>' : '') +
    '<span class="pill' + (c.today.length ? ' amber' : '') + '">今日 ' + c.today.length + '</span>' +
    '<span class="pill">今週 ' + c.week.length + '</span>' +
    '<span class="pill' + (mailOpen.length ? ' amber' : '') + '">メール ' + mailOpen.length + '</span>' +
    (routineList(d, today).length ? '<span class="pill acc">🤖 自動作業 ' + routineList(d, today).length + '</span>' : '') + '</div>';

  if (c.overdue.length) h += sec('⚠️ 期限切れ', c.overdue.length, '<ul>' + c.overdue.map(it => taskLi(it, today)).join('') + '</ul>', 'red');

  const todayEv = cal.filter(e => e.date === today);
  h += sec('📌 今日', c.today.length,
    (c.today.length ? '<ul>' + c.today.map(it => taskLi(it, today)).join('') + '</ul>' : '<p class="empty">期限が今日のタスクはありません</p>') +

// 今日から n 日分のマス。予定は時刻順（終日が先）、期限のあるタスクも同じ日に載せる（純粋関数）
function calDays(events, classified, today, n) {
  const tasks = [].concat(classified.today || [], classified.week || []).filter(t => t.due && !t.ongoing);
  const days = [];
  for (let i = 0; i < n; i++) {
    const date = addDays(today, i);
    const evs = (events || []).filter(e => e.date === date)
      .slice().sort((a, b) => (a.time || '') < (b.time || '') ? -1 : (a.time || '') > (b.time || '') ? 1 : 0);
    days.push({ date: date, events: evs, tasks: tasks.filter(t => t.due === date) });
  }
  return days;
}

      '<span class="dh">' + wd(d.date) + '</span><span class="dn">' + (+d.date.slice(8)) + '</span>' +

    ((stocks.failed || []).length ? ' · 取得失敗 ' + stocks.failed.length : '') + '</div>';
  h += g.fresh.length ? g.fresh.slice(0, STOCK_FRESH).map(a => stockRow(a, today)).join('') : '<p class="empty">新しく基準を超えた銘柄はありません</p>';
  if (g.fresh.length > STOCK_FRESH) h += '<p class="empty">ほか ' + (g.fresh.length - STOCK_FRESH) + ' 件は下のグループ別一覧に</p>';
  g.groups.forEach(x => {
    h += '<details><summary class="day">' + esc(x.label) + '（' + x.threshold + '%以上） ' + x.items.length + '件 ▸</summary>' +
      (x.items.length ? x.items.map(a => stockRow(a, today)).join('') : '<p class="empty">なし</p>') + '</details>';
  });
  return sec('📉 下落アラート' + (g.fresh.length ? '（新規）' : ''), g.fresh.length ? g.fresh.length : total, h);
}
// ---------- ラン・筋トレ ----------
// 筋トレAIコーチの WEEK_PLAN から、その日の枠を返す。枠が無い曜日（月・木）は null＝手術日で休み（純粋関数）
function trainingFor(training, iso) {
  const dow = new Date(iso + 'T00:00:00Z').getUTCDay();
  const slot = ((training && training.plan) || []).filter(p => (p.days || []).indexOf(dow) >= 0)[0];
  return slot || null;
}
const GYM_LABEL = { '1': '志村坂上', '2': '本郷' };
function legText(leg) {
  if (leg === null || leg === undefined) return '脚なし';
  if (leg === '不足時のみ') return '脚は週のセット数が足りないときだけ';
  return { A: '脚A（レッグプレス／ハックスクワット）', B: '脚B（レッグエクステンション＋レッグカール）', C: '脚C（ブルガリアン優先）' }[leg] || '脚' + leg;
}
function trainLi(id, title, sub) {
  const checked = !!S.checks[id];
  return '<li class="task' + (checked ? ' done' : '') + '"><input type="checkbox" data-id="' + esc(id) + '"' + (checked ? ' checked' : '') + ' aria-label="完了">' +
    '<div class="body"><div class="txt">' + title + '</div>' + (sub || '') + '</div></li>';
}
function trainSec(training, today) {
  const slot = trainingFor(training, today);
  const next = trainingFor(training, addDays(today, 1));
  const tmr = '<p class="sub" style="margin:8px 0 0">明日（' + wd(addDays(today, 1)) + '）: ' +
    (next ? esc(next.focus) + '・' + esc(legText(next.leg).replace(/（.*）/, '')) + ' / ' + esc(next.run.replace(/（.*）/, '')) : '休み（手術日・散歩のみ）') + '</p>';
  if (!slot) return sec('🏃 ラン・筋トレ', null, '<p class="empty">今日は休み（手術日）。散歩だけ</p>' + tmr, 'train');
  const m = ((training.menus || {})[S.gym] || {})[slot.key];
  const seg = '<span class="seg">' + ['1', '2'].map(g => '<button type="button" data-act="gym" data-gym="' + g + '" class="' + (S.gym === g ? '' : 'ghost') + '" aria-pressed="' + (S.gym === g) + '">' + GYM_LABEL[g] + '</button>').join('') + '</span>';
  const noRun = /^なし/.test(slot.run);
  let ul = '<ul>';
  if (!noRun) ul += trainLi('train:' + today + ':run', '🏃 ' + esc(slot.run), '<div class="tags"><span>Garminコーチの今日のワークアウトに従う。インターバルは最大の8〜9割</span></div>');
  let gym = '<div class="sub">' + esc(legText(slot.leg)) + '</div>';
  if (m) {
    gym += '<ol>' + m.must.map(n => '<li>' + esc(n) + '</li>').join('') + '</ol>';
    if (m.optional && m.optional.length) gym += '<div class="sub" style="margin-top:4px">余裕があれば</div><ol class="opt">' + m.optional.map(n => '<li>' + esc(n) + '</li>').join('') + '</ol>';
  }
  if (slot.note) gym += '<div class="tags"><span>※ ' + esc(slot.note) + '</span></div>';
  if (slot.leg !== null && slot.leg !== undefined) gym += '<div class="tags"><span>※ ハムに痛みがある日は脚を外す</span></div>';
  ul += trainLi('train:' + today + ':gym', '🏋️ <b>' + esc(slot.focus) + '</b>', gym);
  if (slot.kb) {
    const kbm = training.kbMenus || {};
    const keys = [slot.kbLevel].concat(slot.kbUpper ? ['upper'] : []).filter(k => kbm[k]);
    let kb = keys.length ? '' : '<div class="sub">' + esc(slot.kb) + '</div>';   // メニューが無い古いデータは説明文だけ
    keys.forEach((k, i) => { kb += '<div class="sub"' + (i ? ' style="margin-top:4px"' : '') + '>' + esc(kbm[k].label) + '</div><ol>' + kbm[k].items.map(n => '<li>' + esc(n) + '</li>').join('') + '</ol>'; });
    kb += '<div class="tags"><span>※ ランの日はランの後に。翌朝ハムの張りが残っていたら軽めに</span></div>';
    ul += trainLi('train:' + today + ':kb', '🔔 <b>自宅ケトルベル（' + esc(slot.kbShort || slot.kb.replace(/（.*/, '')) + '）</b>', kb);
  }
  ul += '</ul>';
  const head = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><span class="sub">ジム</span>' + seg + '</div>';
  return sec('🏃 ラン・筋トレ', null, head + ul + tmr, 'train');
}

function oetSec(o, today) {
  const stale = o.date !== today;
  let h = '';
  if (stale) h += '<p class="lead">⚠️ ' + esc(o.date || '') + ' のノートです（今日の分はまだ作られていません）</p>';
  h += (o.lead || []).slice(0, 3).map(l => '<p class="lead">' + inline(l) + '</p>').join('');
  h += '<ul>' + (o.menu || []).map(m => {
    const checked = !!S.checks[m.id];
    return '<li class="task' + (checked ? ' done' : '') + '"><input type="checkbox" data-id="' + esc(m.id) + '"' + (checked ? ' checked' : '') + ' aria-label="完了">' +
      '<div class="body"><div class="txt">' + esc(m.prio) + ' <b>' + esc(m.skill) + '</b> ' + inline(m.text) + '</div><div class="tags"><span>' + esc(m.time) + '</span></div></div></li>';
  }).join('') + '</ul>';
  h += '<div class="tags" style="margin-top:6px">' + noteLink('📌 今日のOET学習') + '<a href="https://zh1235789-png.github.io/oet-weekly-tracker/" target="_blank" rel="noopener">週次トラッカー</a></div>';
  return sec('🎧 OET', o.total ? '（' + esc(o.total) + '）' : null, h);
}

function updateBar() {
  const p = S.gh ? [] : pendingReports(DATA, S.checks, S.sent);
  const bar = document.getElementById('bar');
  bar.classList.toggle('show', p.length > 0);
  document.getElementById('barText').textContent = '完了 ' + p.length + '件';
}

// ---------- 更新ボタン ----------
// ボタン → 本人のトークンで GitHub に title=refresh の issue を立てる → Mac が1分おきに拾って更新・push。
// ページは data.enc.json を読み直し、Mac が書いた refresh（段階とメッセージ）を表示する。
const R = { pressed: 0, req: 0, timer: null, msg: '', err: false, showToken: false, calSel: '' };
const REPO_API = 'https://api.github.com/repos/zh1235789-png/daily-home/issues';
const WAIT_MS = 7 * 60 * 1000;

// 自分の依頼（issue 番号 req）に対して Mac が書いた状態だけを見る（純粋関数）。
// 時刻で比べると iPhone と Mac の時計のずれで取りこぼすので、番号で照合する。
function refreshMessage(data, req, pressed, now) {
  const r = data && data.refresh;
  if (r && Array.isArray(r.req) && r.req.indexOf(req) >= 0) {
    if (r.stage === 'done') return { text: '✅ ' + r.message, done: true, err: false };
    if (r.stage === 'error') return { text: '⚠️ ' + r.message, done: true, err: true };
    return { text: '⏳ ' + r.message, done: false, err: false };
  }
  if (now - pressed > WAIT_MS) return { text: '⚠️ Macから応答がありません（スリープ中かもしれません）', done: true, err: true };
  return { text: '⏳ Macに更新を頼みました（1〜2分で反映、メールはさらに数分）', done: false, err: false };
}

function tokenPanel() {
  return '<section class="token"><h2>🔑 更新ボタンの設定（この端末だけ）</h2>' +
    '<ol><li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHubのトークン作成ページ</a>を開く</li>' +
    '<li>Repository access：<b>Only select repositories → daily-home</b></li>' +
    '<li>Permissions：<b>Issues → Read and write</b>（他は付けない）。期限は1年など</li>' +
    '<li>作ったトークンを下に貼って保存</li></ol>' +
    '<input id="ghToken" type="password" autocomplete="off" aria-label="GitHubトークン" placeholder="github_pat_…">' +
    '<div style="display:flex;gap:8px"><button type="button" data-act="saveToken">保存</button>' +
    (S.gh ? '<button type="button" class="ghost" data-act="clearToken">この端末から消す</button>' : '') +
    '<button type="button" class="ghost" data-act="closeToken">閉じる</button></div></section>';
}

let flushTimer = null;
function queueDone(id, checked) {
  if (checked) { if (S.outbox.indexOf(id) < 0) S.outbox.push(id); }
  else S.outbox = S.outbox.filter(x => x !== id);
  save();
  clearTimeout(flushTimer);
  if (S.outbox.length) {
    R.msg = '⏳ ' + S.outbox.length + '件の完了を数秒後にObsidianへ送ります（取り消すならチェックを外す）'; R.err = false;
    flushTimer = setTimeout(flushDone, 5000);
  } else if (!checked) { R.msg = ''; }
  showMsg();
}
async function flushDone() {
  const ids = S.outbox.slice();
  if (!ids.length || !S.gh) return;
  let res;
  try {
    res = await fetch(REPO_API, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + S.gh, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'done', body: doneBody(ids) }),
    });
  } catch (e) { res = null; }
  if (!res || !res.ok) {
    R.msg = '⚠️ 完了を送れませんでした' + (res ? '（' + res.status + '）' : '（通信を確認）') + '。次にチェックしたときにまとめて送ります'; R.err = true; showMsg(); return;
  }
  S.outbox = S.outbox.filter(x => ids.indexOf(x) < 0);
  ids.forEach(x => { S.sent[x] = todayISO(); });
  save();
  try { R.req = (await res.json()).number; } catch (e) { R.req = 0; }
  R.pressed = Date.now();
  pollRefresh();
}
// 画面全体を描き直さずにメッセージだけ差し替える（チェック直後にスクロール位置が飛ばないように）
function showMsg() {
  const app = document.getElementById('app');
  let p = app.querySelector('.rstat');
  if (!R.msg) { if (p) p.remove(); return; }
  if (!p) { p = document.createElement('p'); app.querySelector('header').insertAdjacentElement('afterend', p); }
  p.className = 'rstat' + (R.err ? ' err' : '');
  p.textContent = R.msg;
}

async function requestRefresh() {
  if (!S.gh) { R.showToken = true; R.msg = '更新ボタンを使うには、最初にトークンを設定してください'; R.err = false; render(); return; }
  let res;
  try {
    res = await fetch(REPO_API, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + S.gh, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'refresh', body: 'デイリーホームの更新ボタンから' }),
    });
  } catch (e) {
    R.msg = '⚠️ GitHubにつながりません（通信を確認）'; R.err = true; render(); return;
  }
  if (res.status === 401 || res.status === 403 || res.status === 404) {
    R.msg = '⚠️ トークンが使えません（期限切れか権限不足）。⚙から設定し直してください'; R.err = true; render(); return;
  }
  if (!res.ok) { R.msg = '⚠️ GitHubでエラー（' + res.status + '）'; R.err = true; render(); return; }
  try { R.req = (await res.json()).number; } catch (e) { R.req = 0; }
  R.pressed = Date.now();
  pollRefresh();
}

async function pollRefresh() {
  clearTimeout(R.timer);
  try { DATA = await load(S.pass); } catch (e) { /* 次の回で読む */ }
  const m = refreshMessage(DATA, R.req, R.pressed, Date.now());
  R.msg = m.text; R.err = m.err;
  render();
  R.timer = m.done ? null : setTimeout(pollRefresh, 15000);
}

async function onAppClick(ev) {
  const b = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'refresh') {
    if (R.timer) return; // 更新中は受け付けない（二重に頼むと待ち状態が分からなくなる）
    R.msg = '⏳ 最新のデータを読み込み中…'; R.err = false; render();
    try { DATA = await load(S.pass); } catch (e) { /* 表示は前のまま */ }
    render();
    requestRefresh();
  } else if (act === 'calday') { R.calSel = b.dataset.date; render(); }
  else if (act === 'tab') { S.tab = TABS.indexOf(b.dataset.tab) >= 0 ? b.dataset.tab : 'home'; save(); render(); window.scrollTo(0, 0); }
  else if (act === 'gym') { S.gym = b.dataset.gym === '2' ? '2' : '1'; save(); render(); }
  else if (act === 'settings') { R.showToken = !R.showToken; render(); }
  else if (act === 'closeToken') { R.showToken = false; render(); }
  else if (act === 'clearToken') { S.gh = ''; save(); R.showToken = false; R.msg = 'トークンを消しました'; R.err = false; render(); }
  else if (act === 'saveToken') {
    const v = (document.getElementById('ghToken').value || '').trim();
    if (!v) return;
    S.gh = v; save(); R.showToken = false; R.msg = 'トークンを保存しました。🔄 更新 を押せます'; R.err = false; render();
  }
}

// ---------- 復号 ----------
function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decrypt(env, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(env.salt), iterations: env.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function load(pass) {
  const r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('データを取得できませんでした（' + r.status + '）');
  const env = await r.json();
  return decrypt(env, pass);
}

function showLock(msg) {
  document.getElementById('app').hidden = true;
  document.getElementById('lock').hidden = false;
  document.getElementById('lockErr').textContent = msg || '';
}

async function start() {
  if (!S.pass) { showLock(); return; }
  try {
    DATA = await load(S.pass);
  } catch (e) {
    showLock(e && e.name === 'OperationError' ? 'パスフレーズが違います' : String((e && e.message) || e));
    return;
  }
  // データから消えた項目のチェックは捨てる（保存領域を育てない）
  const live = new Set();
  const walk = (arr) => (arr || []).forEach(it => { live.add(it.id); walk(it.children); });
  ['week', 'dated', 'big', 'someday'].forEach(k => walk(DATA.hub[k]));
  ((DATA.oet && DATA.oet.menu) || []).forEach(m => live.add(m.id));
  engRoutine(todayISO()).forEach(r => live.add(r.id));
  trainIds(DATA.training, todayISO()).forEach(id => live.add(id));
  ((DATA.gmail && DATA.gmail.items) || []).forEach(m => live.add('mail:' + m.url));
  Object.keys(S.checks).forEach(k => { if (!live.has(k)) delete S.checks[k]; });
  Object.keys(S.sent).forEach(k => { if (!live.has(k)) delete S.sent[k]; });
  save();
  S.outbox = S.outbox.filter(x => live.has(x));
  save();
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  render();
  if (S.gh && S.outbox.length && !flushTimer) flushTimer = setTimeout(flushDone, 1000);
}

function bind() {
  document.getElementById('lockForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    S.pass = document.getElementById('pass').value.trim();
    save();
    start();
  });
  document.getElementById('app').addEventListener('change', (ev) => {
    const t = ev.target;
    if (!t || !t.dataset || !t.dataset.id) return;
    const id = t.dataset.id;
    if (!t.checked && S.gh && S.sent[id]) {
      // すでにObsidianへ反映済み：ここで外しても戻らないので、チェックは残す
      t.checked = true;
      R.msg = 'このタスクはObsidianに反映済みです。戻すときはObsidianのタスクハブで直してください'; R.err = true; showMsg();
      return;
    }
    if (t.checked) S.checks[id] = todayISO(); else { delete S.checks[id]; delete S.sent[id]; }
    save();
    t.closest('li').classList.toggle('done', t.checked);
    if (S.gh && hubIds(DATA).has(id)) queueDone(id, t.checked);
    updateBar();
    // 英語タブのバッジ（未完了数）を合わせる
    const nav = document.querySelector('.tabbar');
    if (nav) nav.outerHTML = tabNav(S.tab, DATA, todayISO());
    if (id.indexOf('eng:') === 0) render(); // 「済 n/4」を合わせる
  });
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const items = pendingReports(DATA, S.checks, S.sent);
    if (!items.length) return;
    const text = reportText(items);
    try {
      if (navigator.share) await navigator.share({ text: text });
      else { await navigator.clipboard.writeText(text); alert('コピーしました。リマインダーの「Inbox」に貼り付けてください'); }
    } catch (e) {
      return; // 共有をキャンセルしたときは送信済みにしない
    }
    items.forEach(it => { S.sent[it.id] = todayISO(); });
    save();
    updateBar();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    pendingReports(DATA, S.checks, S.sent).forEach(it => { delete S.checks[it.id]; });
    save();
    render();
  });
  document.getElementById('app').addEventListener('click', onAppClick);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DATA && !R.timer) start(); });
}

if (typeof document !== 'undefined' && document.getElementById('app') && typeof document.getElementById('app').addEventListener === 'function') {
  bind();
  start();
}
